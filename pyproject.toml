[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cma-python"
version = "9.0"
description = "Credit Monitoring & Analytics — local-first credit analytics backend for Indian banks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
    "scikit-learn==1.5.2",
    "statsmodels==0.14.4",
    "scipy==1.14.1",
    "ollama==0.4.4",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "apscheduler==3.10.4",
    "jugaad-data==0.31.1",
    "feedparser==6.0.11",
    "python-docx==1.1.2",
    "pypdf==5.1.0",
    "pypdfium2==4.30.0",
    "pytesseract==0.3.13",
    "pytest==8.3.4",
    "httpx==0.27.2",
]

[tool.setuptools.packages.find]
where = ["src"]
